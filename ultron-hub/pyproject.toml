[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-hub"
version = "0.1.0"
description = "Headless job runner: Hermes -> ultron-hub -> claude -p"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0", "pypdf>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]
bot = ["python-telegram-bot>=22.8,<23"]  # ultron-hub bot run (todo #193), même version que Hermes
voice = ["faster-whisper>=1.0"]  # vocaux du bot direct (todo #195) : modèle small, cpu, int8, fr (à installer avant la bascule)

[project.scripts]
ultron-hub = "ultron_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ultron_hub = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
